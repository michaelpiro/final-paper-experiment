# =========================================================================
# IID single-class experiment (Pavia-University)
# =========================================================================
# Background = ONE labeled class; the target signature is the mean spectrum of
# another class, planted additively. Every detector consumes the RAW 103 bands;
# the score detectors (DART/L-DART, LRao/L-LRao) carry a frozen ZCA whitening
# first layer fit on the training background. Two sweeps: vs n and vs rho.
# Detectors shown: AMF, L-DART, DART, LRao, L-LRao.

dataset: data/pavia-u.mat

# ----- whitening (ZCA only; frozen first layer of the score nets) -----
whiten_eig_floor:      0.0            # 0 -> auto floor at 1e-5 x lambda_max
lrao_whiten_eig_floor: 1.0e-10        # LRao floor (x lambda_max) keeps C_psi invertible

# ----- classes (single-class: one background vs one target) -----
bkg_cls: 2                            # asphalt background
target_cls: 4                         # trees target
exclude_classes: []

# ----- planted target (additive) -----
amplitude: 0.15                       # theta
target_fraction: 0.10
test_size: 2000

# ----- sweep axes -----
n_train_list: [20, 40, 60, 100, 200, 500, 1000, 2000]
rho_list: [0.00001, 0.001, 0.005, 0.01, 0.3, 0.5, 0.07, 0.1, 0.5, 1.0, 3.0, 10.0]  # exact paper sweep
n_fixed_for_rho: 400

# ----- metric operating points -----
pfa: 0.1                              # Pd at this false-alarm rate
pauc_fpr: 0.1                         # partial AUC over Pfa < this

# ----- score-net architectures (paper names via the *_label keys) -----
hidden_dims:    []                    # primary  = linear  -> L-DART
activation:     silu
dsm_label:      "L-DART"
hidden_dims_2:  [128]                 # secondary = MLP    -> DART
activation_2:   relu
dsm2_label:     "DART"

# ----- training budgets -----
dsm_epochs:  2000
lrao_epochs: 2000

# ----- best-epoch selection (optional held-out validation) -----
val_fraction:    0.0                  # 0 = use all data, checkpoint by train loss
val_check_every: 100

# ----- optimizer (DART/L-DART and LRao/L-LRao) -----
lr: 0.0005
weight_decay: 0.00005
batch_size: 512

# ----- DSM noise level (numeric rho only; sigma = sqrt(rho) in whitened space) -----
dsm_sigma_rho: 0.1

# ----- learned-Rao (LRao / L-LRao) specifics -----
lfi_delta_theta: 0.01
lfi_sigma_cutoff: 0.000001
lfi_detach_sigma: true                # detach Sigma -> stable (no variance collapse)
lrao_grad_clip: 1.0
run_lrao_mlp: true                    # also train the MLP LRao (headline)
lrao_val_fraction: 0.1                # validation early stopping (paper Table I)
lrao_val_check_every: 1
lrao_patience: 3
lrao_min_delta: 0.005

# ----- GMM-Levin -----
gmm_K: 2

# ----- reproducibility (list -> multi-seed mean +/- std) -----
seed: [42, 43, 44, 45, 46]

# ----- output -----
results_dir: results/iid_single
